[project]
name = "auth"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "blake3>=1.0.11",
    "fastapi[standard]>=0.162.5",
    "sqlmodel>=0.0.49",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.101"]

[tool.uv]
package = false

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "FAST"]

[tool.pytest.ini_options]
pythonpath = ["."]
